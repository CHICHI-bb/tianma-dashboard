<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三家/重点稿件 自动投放</title>
<style>
:root{--line:#e4e7ec;--sub:#667085;--blue:#165DFF;--green:#039855;--red:#d92d20;--orange:#dc6803}
*{box-sizing:border-box}
body{margin:0;background:#f7f8fa;color:#101828;font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 60px}
.back{display:inline-block;margin-bottom:20px;font-size:13px;color:#667085;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:#fff}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 18px;font-size:13.5px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px}
.pill b{color:var(--blue)}
.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px}
.th{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bv{font-size:17px;font-weight:700;font-family:Consolas,monospace}
.tt{color:var(--sub);font-size:13px}
.st{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.st.ok{background:#ecfdf3;color:var(--green)}.st.warn{background:#fffaeb;color:var(--orange)}.st.bad{background:#fef3f2;color:var(--red)}.st.idle{background:#f2f4f7;color:#667085}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.k{background:#fafbfc;border:1px solid #f0f2f5;border-radius:10px;padding:10px 12px}
.k small{display:block;color:var(--sub);font-size:11.5px}
.k b{display:block;font-size:21px;font-weight:700;margin-top:3px}
.adv{border-left:4px solid #98a2b3;background:#fafbfc;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.adv b{font-size:11.5px;color:var(--sub);display:block;font-weight:700;letter-spacing:.3px}
.chart{background:#fafbfc;border:1px solid #f0f2f5;border-radius:10px;padding:10px 8px 4px;margin-bottom:12px}
.chart .ct{font-size:11.5px;color:var(--sub);margin:0 0 4px 6px;display:flex;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:#98a2b3;font-weight:600;font-size:11px;padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid #f5f6f8}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:700;background:#f2f4f7;color:#667085}
.tag.live{background:#eff4ff;color:var(--blue)}.tag.done{background:#f2f4f7;color:#98a2b3}.tag.warn{background:#fef3f2;color:var(--red)}
.sec{margin-top:14px;border-top:1px solid #f0f2f5;padding-top:12px}
.sec h4{font-size:11.5px;color:var(--sub);margin:0 0 8px;font-weight:700;letter-spacing:.3px}
.plan-foot{font-size:12px;color:#344054;margin-top:8px}
.chips span{display:inline-block;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:3px 8px;margin:3px 4px 0 0;font-size:11px}
.tl{list-style:none;margin:0;padding:0;font-size:12px}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:8px;color:#344054;line-height:1.85}
.tl b{color:#98a2b3;font-family:Consolas,monospace;font-size:11px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{flex:1;min-width:130px;padding:9px 0;border-radius:8px;border:1px solid #d0d5dd;background:#fff;font-size:12.5px;font-weight:600;color:#667085;cursor:not-allowed}
.acts button.hot{border-color:#fda29b;color:#d92d20}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:#98a2b3}
.foot{color:#98a2b3;font-size:12px;margin-top:24px;text-align:center}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}

/* ===== 三家稿件 ===== */
.sj-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 10px;flex-wrap:wrap}
.sj-head .t{display:flex;align-items:baseline;gap:10px}
.sj-head h2{font-size:19px;margin:0}
.sj-head small{color:#98a2b3;font-size:12px}
.sj-btn{padding:6px 14px;border-radius:99px;border:0;background:#0a7f46;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.sj-alert{background:#fef3f2;border:1px solid #fda29b;border-left:4px solid #d92d20;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#b42318}
.sj-alert div+div{margin-top:6px}
.sj{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;transition:.2s}
.sj.gone{opacity:.55;filter:grayscale(1);background:#fbfbfc}
.sj-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sj-bv{font-family:Consolas,monospace;font-weight:700;font-size:16px;color:#101828;text-decoration:none}
.sj-bv:hover{color:#165DFF;text-decoration:underline}
.sj-title{color:#667085;font-size:12.5px;margin-left:8px}
.sj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.sj-k{background:#fafbfc;border:1px solid #f0f2f5;border-radius:9px;padding:8px 10px}
.sj-k small{display:block;color:#98a2b3;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sj-k b{display:block;font-size:16px;margin-top:2px}
.pb{height:6px;background:#f0f2f5;border-radius:99px;overflow:hidden;margin:2px 0 10px}
.pb i{display:block;height:100%;background:#165DFF;transition:.4s}
.pb i.hit{background:#039855}
.sj-tb{width:100%;border-collapse:collapse;font-size:12px}
.sj-tb th{text-align:left;color:#98a2b3;font-weight:600;font-size:11px;padding:5px 6px;border-bottom:1px solid var(--line)}
.sj-tb td{padding:6px;border-bottom:1px solid #f5f6f8}
.sj-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sj-links a{font-size:12px;color:#165DFF;text-decoration:none;border:1px solid #d1e0ff;background:#f5f8ff;border-radius:7px;padding:4px 10px}
.sj-links a:hover{background:#eaf1ff}
.tag2{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;white-space:nowrap}
.tag2.run{background:#ecfdf3;color:#039855}
.tag2.done{background:#f2f4f7;color:#98a2b3}
.tag2.warn{background:#fffaeb;color:#dc6803}
.tag2.bad{background:#fef3f2;color:#d92d20}
.sj-note{font-size:12px;color:#667085;margin-top:8px}
@media(max-width:820px){.sj-grid{grid-template-columns:1fr 1fr}}
.sj.done{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;padding:12px 16px;opacity:.55;filter:grayscale(1);background:#fbfbfc}
.sj-meta{color:#98a2b3;font-size:12px}
.mini{display:flex;align-items:flex-end;gap:28px;margin-top:10px;flex-wrap:wrap}
.mini .m small{display:block;color:#98a2b3;font-size:11px}
.mini .m b{font-size:20px;font-weight:700}
.mini .m b i{font-size:12px;color:#98a2b3;font-style:normal;font-weight:400}
.mini .lk{margin-left:auto;font-size:12.5px;color:#165DFF;text-decoration:none;border:1px solid #d1e0ff;background:#f5f8ff;border-radius:8px;padding:7px 13px}
</style></head><body>

<script>window.TIANMA_API='http://127.0.0.1:7788';</script>

  <h1>三家稿件 · 自动投放</h1>
  <p class="lead">24h 内过 5w · 单篇 40w 封顶 · 首选 AI 天马，强保量只在推不过时保底。播放每 15 分钟、后台消耗每小时更新。</p>
  <div style="margin:0 0 14px;display:flex;gap:8px;align-items:center"><input id="sj_search" placeholder="搜 BV 查投放状态" onkeydown="if(event.key==='Enter')sjSearch()" style="flex:1;max-width:300px;padding:8px 12px;border:1px solid #d0d5dd;border-radius:8px;font-size:13px"><button onclick="sjSearch()" style="padding:8px 14px;border:1px solid #165DFF;background:#165DFF;color:#fff;border-radius:8px;font-size:13px;cursor:pointer">搜索</button></div><div id="sj_result"></div><div id="sanjia"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// ================= 三家稿件 =================
var SJ_MGR='https://manager.bilibili.co/v2#/app-rec/';
// ===== 共享执行端（跑在有后台权限的那台机器上）=====
var SJ_EXEC='http://CN210217175:7788';
var SJ_KEY='2d905d3efd96a652c06de86a28aadae6';
function sjWan(v){return v==null?'—':(v/10000).toFixed(2)+'w';}
function sjDur(min){ if(min==null)return '—'; if(min<=0)return '已到期'; var d=Math.floor(min/1440),h=Math.floor((min%1440)/60),m=min%60; return d?(d+'天'+h+'h'):(h?(h+'h'+m+'m'):(m+'m')); }
function sjGate(g){
  if(!g) return ['—','#98a2b3'];
  if(g.ok===true) return ['✓ 过 1w'+(g.mins!=null?' · '+g.mins+'min':''), '#039855'];
  if(g.ok===false) return ['✗ 未过 1w','#d92d20'];
  return ['待观察 · 还剩 '+g.left+'min','#dc6803'];
}
function sjPlanStrip(t){
  var plan=t.plan||[]; if(!plan.length) return '';
  var done=(t.rounds||[]).length;
  var out=plan.map(function(p,i){
    var used=i<done;
    var label='R'+p.n+' '+(p.ai?'AI天马':p.gd)+' '+(p.budget/10000)+'w';
    if(p.lastResort) label+=' · 保底';
    return '<span style="display:inline-block;margin:2px 6px 0 0;padding:2px 7px;border-radius:6px;font-size:11px;'
      +(used?'background:#eef4ff;color:#165DFF;border:1px solid #d1e0ff':'background:#f8fafc;color:#98a2b3;border:1px solid #eef0f3')
      +(p.lastResort&&!used?';border-style:dashed':'')+'">'+label+'</span>';
  }).join('');
  return '<div class="sj-note" style="margin-top:6px">投放计划（首选 AI 天马，强保量仅保底）'+out+'</div>';
}
function sjCard(t){
  var done=(t.status!=='running');
  var v=t.v||0, tg=t.target||50000, spent=t.tianmaSpent||0;
  var bv=t.bvid;
  var bgl='https://manager.bilibili.co/v2#/app-rec/tianma/position?card_classify=1&resource_type=1&resource_oid='+bv;
  if(done){
    var pub=t.pubdate?new Date(t.pubdate*1000).toLocaleDateString('zh-CN').slice(5):'—';
    return '<div class="sj done">'
      +'<a class="sj-bv" href="https://www.bilibili.com/video/'+bv+'" target="_blank">'+bv+'</a>'
      +'<span class="sj-title">'+String(t.title||'').slice(0,52)+'</span>'
      +'<span class="sj-meta">'+(t.author||'—')+' · 发布 '+pub+' · 消耗天马 '+sjWan(spent)+'</span>'
      +'<span class="tag2 done" style="margin-left:auto">'+(t.status==='done'?'已过 5w · 资源已下线':(t.status==='stopped'?'临时下线':'已收尾 · 资源已下线'))+'</span>'
      +'</div>';
  }
  return '<div class="sj">'
    +'<div class="sj-top"><a class="sj-bv" href="https://www.bilibili.com/video/'+bv+'" target="_blank">'+bv+'</a>'
    +'<a class="sj-title" href="https://www.bilibili.com/video/'+bv+'" target="_blank" style="text-decoration:none">'+String(t.title||'').slice(0,52)+'</a></div>'
    +'<div class="mini">'
    +'<span class="m"><small>当前播放</small><b>'+sjWan(v)+'<i> / 5w</i></b></span>'
    +'<span class="m"><small>消耗天马</small><b>'+sjWan(spent)+'</b></span>'
    +'<a class="lk" href="'+bgl+'" target="_blank">后台记录 →</a><button class="sj-stop" onclick="sjStop(\''+t.id+'\')" style="margin-left:auto;padding:4px 12px;border:1px solid #d92d20;background:#fff;color:#d92d20;border-radius:7px;font-size:12px;cursor:pointer">不投了</button>'
    +'</div></div>';
}
function renderSanjia(D){
  var box=document.getElementById('sanjia'); if(!box) return;
  var arr=(D.sanjia||[]).slice();
  var alerts=(D.alerts||[]).filter(function(a){return a.level==='bad'||a.level==='warn';}).slice(0,4);
  var head='<div class="sj-head"><div class="t"><h2>三家稿件</h2><small id="sj_sum"></small></div>'
    +'<div style="display:flex;gap:8px;align-items:center">'
    +'<a href="'+SJ_EXEC+'/sanjia.html" target="_blank" style="font-size:12px;color:#165DFF;text-decoration:none;border:1px solid #d1e0ff;background:#f5f8ff;border-radius:99px;padding:5px 12px">实时看板</a>'
    +'<button class="sj-btn" onclick="sjOpenForm()">＋ 登记三家稿件</button></div></div>';
  if(!arr.length){
    box.innerHTML=head+'<div class="empty" style="padding:30px">暂无三家稿件任务 · 登记后 24h 内目标 5w 播放</div>';
    return;
  }
  var live=arr.filter(function(t){return t.status==='running';});
  var dead=arr.filter(function(t){return t.status!=='running';});
  live.sort(function(a,b){return (b.v||0)-(a.v||0);});
  dead.sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
  var okCount=dead.filter(function(t){return t.status==='done';}).length;
  var sjTime=LIVE_OK?('实时 '+new Date(LIVE_AT).toLocaleTimeString('zh-CN')):(window.TIANMA_SANJIA&&window.TIANMA_SANJIA.publishedAt?new Date(window.TIANMA_SANJIA.publishedAt).toLocaleString('zh-CN').slice(5,17):'快照');
  var h=head.replace('<small id="sj_sum"></small>','<small>在跑 <b>'+live.length+'</b> 篇 · 24h 过关 <b>'+okCount+'</b> 篇 · 单篇 40w 封顶 · 数据 '+sjTime+'</small>');
  if(alerts.length){ h+='<div class="sj-alert">'+alerts.map(function(a){return '<div>⚠ '+a.bvid+' · '+a.text+'</div>';}).join('')+'</div>'; }
  live.forEach(function(t){ h+=sjCard(t); });
  if(dead.length){
    h+='<div class="sj-head" style="margin-top:22px"><div class="t"><h2 style="font-size:15px;color:#98a2b3">已结束 · 数据保留</h2></div></div>';
    dead.forEach(function(t){ h+=sjCard(t); });
  }
  box.innerHTML=h;
}
// ===== 实时通道：优先走隧道拿实时数据；拿不到自动回退静态快照 =====
var TUNNEL=(function(){try{var q=new URLSearchParams(location.search).get('tunnel');if(q){localStorage.setItem('sj_tunnel',q);return q.replace(/\/+$/,'');}return (localStorage.getItem('sj_tunnel')||'https://seo-fit-consortium-henry.trycloudflare.com').replace(/\/+$/,'');}catch(e){return 'https://seo-fit-consortium-henry.trycloudflare.com';}})();
var LIVE=null, LIVE_OK=false, LIVE_AT=0;
async function fetchLive(){
  if(!TUNNEL) return false;
  try{
    var ctl=new AbortController(); var tm=setTimeout(function(){ctl.abort();},6000);
    var r=await fetch(TUNNEL+'/api/state?live=1',{cache:'no-store',signal:ctl.signal});
    clearTimeout(tm);
    if(!r.ok) throw new Error('http '+r.status);
    var j=await r.json();
    if(!j||!j.sanjia) throw new Error('bad payload');
    LIVE=j; LIVE_OK=true; LIVE_AT=Date.now(); return true;
  }catch(e){ LIVE_OK=false; return false; }
}
var DEMO=false, AUTO_DEMO=false;
function pickSjData(){ if(DEMO) return window.TIANMA_DEMO_SANJIA||{sanjia:[],alerts:[]}; if(LIVE&&LIVE.sanjia) return {sanjia:LIVE.sanjia,alerts:LIVE.alerts||[]}; return window.TIANMA_SANJIA||{sanjia:[],alerts:[]}; }
function renderSj(){ renderSanjia(pickSjData()); var f=document.getElementById('foot'); if(f){ f.textContent = LIVE_OK ? ('实时数据 · '+new Date(LIVE_AT).toLocaleTimeString('zh-CN')+' · 每 20 秒自动刷新') : ''; } if(f&&!LIVE_OK&&window.TIANMA_SANJIA&&window.TIANMA_SANJIA.publishedAt){ f.textContent='数据快照 '+new Date(window.TIANMA_SANJIA.publishedAt).toLocaleString('zh-CN'); } }
function toggleDemo(){ DEMO=!DEMO; AUTO_DEMO=false; paintDemoBar(); renderSj(); }
function paintDemoBar(){
  var el2=document.getElementById('demoBar'); if(!el2) return;
  if(!DEMO){ el2.style.display='none'; el2.innerHTML=''; return; }
  el2.style.display='block';
  el2.innerHTML='<span style="background:#fffaeb;color:#b54708;border:1px solid #f5d78e;border-radius:6px;padding:3px 10px;font-weight:700">演示数据 · 非真实投放</span>'
   +'<span style="margin-left:10px;color:#8a6100">这是样张，用来看页面长什么样</span>'
   +'<button onclick="toggleDemo()" style="margin-left:12px;border:1px solid #f5d78e;background:#fff;color:#b54708;border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer">切回真实数据</button>';
}
(function(){ var box=document.getElementById('sanjia'); if(!box) return; var d=document.createElement('div'); d.id='demoBar'; d.style.cssText='display:none;margin:0 0 14px;background:#fffaf0;border:1px solid #f5d78e;border-radius:10px;padding:10px 14px;font-size:12.5px'; box.parentNode.insertBefore(d,box); })();
(async function bootSj(){
  var got=await fetchLive();
  if(!got){ var real=window.TIANMA_SANJIA; if(!(real&&real.sanjia&&real.sanjia.length)){ DEMO=true; AUTO_DEMO=true; } }
  paintDemoBar(); renderSj();
  setInterval(refreshLoop,20000);
})();
async function refreshLoop(){
  var ok=await fetchLive();
  if(ok){ renderSj(); } else if(!LIVE){ reloadData(); }
}
function reloadData(){ if(DEMO) return; var s=document.createElement('script');s.src='data/sanjia.js?v='+Date.now();s.onload=function(){ if(AUTO_DEMO){ var r=window.TIANMA_SANJIA; if(!(r&&r.sanjia&&r.sanjia.length)){ s.remove(); return; } DEMO=false; AUTO_DEMO=false; paintDemoBar(); } renderSj(); s.remove(); };document.body.appendChild(s);}
setInterval(reloadData,60000);
</script>

<script>
  window.sjOpenForm=function(){ document.getElementById('mask2').style.display='flex'; };
  window.sjStop=function(id){
    if(!confirm('确定停止这条稿件并下线所有卡片？')) return;
    location.href=(window.SJ_EXEC||API)+'/do?act=sanjia_stop&taskId='+encodeURIComponent(id)+'&k='+(window.SJ_KEY||'')+'&back='+encodeURIComponent(BACK);
  };
  function sjStateText(s){
    var m={0:'待投放',1:'投放中',2:'已结束',3:'已暂停',4:'投放中',5:'已下线',6:'待审核'};
    return (m[s]!==undefined)?m[s]:('状态'+s);
  }
  function sjApi(path){
    var cross=(location.hostname&&location.hostname.indexOf('github.io')>=0);
    var base=cross?TUNNEL:'';
    return fetch(base+path).then(function(r){return r.json();});
  }
  function sjBox(inner){ return '<div style="padding:10px 14px;border:1px solid #e4e7ec;border-radius:8px;margin-bottom:8px;font-size:12.5px">'+inner+'</div>'; }
  function liveLookup(bv,box,raw){
    box.innerHTML=sjBox('<span style="color:#475467">本地无登记，正在查天马后台…（首次约 20~40 秒）</span>');
    sjApi('/api/lookup?bv='+encodeURIComponent(bv)).then(function(d){
      if(!d||!d.ok){
        var why=(d&&(d.error||d.err))||'未知错误';
        box.innerHTML='<div style="padding:10px 14px;background:#fff7f7;border:1px solid #f0c0c0;border-radius:8px;color:#d92d20;font-size:12.5px">后台查询失败：'+why+'</div>';
        return;
      }
      var html='';
      if((d.cards||[]).length){
        html+='<div style="font-size:12px;color:#667085;margin:0 0 6px">天马后台 · 已查 '+d.plans+' 个项目池</div>';
        html+=(d.cards).map(function(c){
          var on=(c.state===1||c.state===4);
          return sjBox('<div style="font-weight:600">'+d.bv+' <span style="color:'+(on?'#0a7f46':'#667085')+'">'+sjStateText(c.state)+'</span></div>'
            +'<div style="color:#98a2b3">项目池 '+c.plan+' · 预算 '+(Math.round(c.budget/1000)/10)+'w · '+(c.start||'')+' ~ '+(c.end||'')+' · 创建人 '+(c.creator||'-')+'</div>');
        }).join('');
      }
      if((d.hot||[]).length){
        html+='<div style="font-size:12px;color:#667085;margin:10px 0 6px">热搜提报</div>';
        html+=(d.hot).map(function(h){
          return sjBox('<div style="font-weight:600">'+(h.word||'')+'</div>'
            +'<div style="color:#98a2b3">状态 '+(h.status)+' · 提报人 '+(h.creator||'-')+'</div>');
        }).join('');
      }
      if(!html){
        html='<div style="padding:10px 14px;background:#fff7f7;border:1px solid #f0c0c0;border-radius:8px;color:#d92d20;font-size:12.5px">天马后台（已查 '+d.plans+' 个项目池）里也没有 '+raw+' 的投放记录。注意 BV 号大小写必须与后台一致。</div>';
      }
      box.innerHTML=html;
    }).catch(function(e){
      box.innerHTML='<div style="padding:10px 14px;background:#fff7f7;border:1px solid #f0c0c0;border-radius:8px;color:#d92d20;font-size:12.5px">查询出错：'+(e&&e.message||e)+'</div>';
    });
  }
  window.sjSearch=function(){
    var raw=(document.getElementById('sj_search').value||'').trim();
    var q=raw.toUpperCase();
    var bv=(raw.length>2&&/^bv/i.test(raw))?('BV'+raw.slice(2)):raw;
    var box=document.getElementById('sj_result'); if(!box) return;
    if(!q){ box.innerHTML=''; return; }
    var D=window.TIANMA_SANJIA||{sanjia:[]};
    var hits=(D.sanjia||[]).filter(function(t){ return (t.bvid||'').toUpperCase().indexOf(q)>=0; });
    if(!hits.length){ liveLookup(bv,box,raw); return; }
    box.innerHTML=hits.map(function(t){
      var st=t.status==='running'?'投放中':(t.status==='done'?'已达标下线':'已停/收尾');
      var r=(t.rounds||[]).length?('已投 '+t.rounds.length+' 轮 · 最近项目 '+t.rounds[t.rounds.length-1].project):'未投';
      return sjBox('<div style="font-weight:600">'+t.bvid+' <span style="color:'+(t.status==='running'?'#0a7f46':'#667085')+'">'+st+'</span></div>'
        +'<div style="color:#667085">'+(t.title||'')+'</div>'
        +'<div style="color:#98a2b3">'+r+' · 播放 '+sjWan(t.v)+' · 消耗天马 '+sjWan(t.tianmaSpent)+' · 提交人 '+(t.requester||'未填')+'</div>');
    }).join('');
  };  window.submitSanjia=function(){
    var bv=document.getElementById('s_bv').value.trim();
    var msg=document.getElementById('s_msg');
    if(!/^BV[0-9A-Za-z]{8,12}$/.test(bv)){msg.textContent='BV 号格式不对';return;}
    var by=document.getElementById('s_by')?document.getElementById('s_by').value.trim():'';
    if(by){ try{localStorage.setItem('sj_by',by);}catch(e){} }
    go('act=new_sanjia&bvid='+encodeURIComponent(bv)+'&by='+encodeURIComponent(by)+'&reason='+encodeURIComponent(document.getElementById('s_rk').value||''));
  };
</script>
</body></html>
