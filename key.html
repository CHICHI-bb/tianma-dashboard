<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三家/重点稿件 自动投放</title>
<style>
:root{--line:#e4e7ec;--sub:#667085;--blue:#165DFF;--green:#039855;--red:#d92d20;--orange:#dc6803}
*{box-sizing:border-box}
body{margin:0;background:#f7f8fa;color:#101828;font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 60px}
.back{display:inline-block;margin-bottom:20px;font-size:13px;color:#667085;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:#fff}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 18px;font-size:13.5px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px}
.pill b{color:var(--blue)}
.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px}
.th{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bv{font-size:17px;font-weight:700;font-family:Consolas,monospace}
.tt{color:var(--sub);font-size:13px}
.st{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.st.ok{background:#ecfdf3;color:var(--green)}.st.warn{background:#fffaeb;color:var(--orange)}.st.bad{background:#fef3f2;color:var(--red)}.st.idle{background:#f2f4f7;color:#667085}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.k{background:#fafbfc;border:1px solid #f0f2f5;border-radius:10px;padding:10px 12px}
.k small{display:block;color:var(--sub);font-size:11.5px}
.k b{display:block;font-size:21px;font-weight:700;margin-top:3px}
.adv{border-left:4px solid #98a2b3;background:#fafbfc;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.adv b{font-size:11.5px;color:var(--sub);display:block;font-weight:700;letter-spacing:.3px}
.chart{background:#fafbfc;border:1px solid #f0f2f5;border-radius:10px;padding:10px 8px 4px;margin-bottom:12px}
.chart .ct{font-size:11.5px;color:var(--sub);margin:0 0 4px 6px;display:flex;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:#98a2b3;font-weight:600;font-size:11px;padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid #f5f6f8}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:700;background:#f2f4f7;color:#667085}
.tag.live{background:#eff4ff;color:var(--blue)}.tag.done{background:#f2f4f7;color:#98a2b3}.tag.warn{background:#fef3f2;color:var(--red)}
.sec{margin-top:14px;border-top:1px solid #f0f2f5;padding-top:12px}
.sec h4{font-size:11.5px;color:var(--sub);margin:0 0 8px;font-weight:700;letter-spacing:.3px}
.plan-foot{font-size:12px;color:#344054;margin-top:8px}
.chips span{display:inline-block;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:3px 8px;margin:3px 4px 0 0;font-size:11px}
.tl{list-style:none;margin:0;padding:0;font-size:12px}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:8px;color:#344054;line-height:1.85}
.tl b{color:#98a2b3;font-family:Consolas,monospace;font-size:11px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{flex:1;min-width:130px;padding:9px 0;border-radius:8px;border:1px solid #d0d5dd;background:#fff;font-size:12.5px;font-weight:600;color:#667085;cursor:not-allowed}
.acts button.hot{border-color:#fda29b;color:#d92d20}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:#98a2b3}
.foot{color:#98a2b3;font-size:12px;margin-top:24px;text-align:center}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}

/* ===== 三家稿件 ===== */
.sj-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 10px;flex-wrap:wrap}
.sj-head .t{display:flex;align-items:baseline;gap:10px}
.sj-head h2{font-size:19px;margin:0}
.sj-head small{color:#98a2b3;font-size:12px}
.sj-btn{padding:6px 14px;border-radius:99px;border:0;background:#0a7f46;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.sj-alert{background:#fef3f2;border:1px solid #fda29b;border-left:4px solid #d92d20;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#b42318}
.sj-alert div+div{margin-top:6px}
.sj{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;transition:.2s}
.sj.gone{opacity:.55;filter:grayscale(1);background:#fbfbfc}
.sj-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sj-bv{font-family:Consolas,monospace;font-weight:700;font-size:16px;color:#101828;text-decoration:none}
.sj-bv:hover{color:#165DFF;text-decoration:underline}
.sj-title{color:#667085;font-size:12.5px;margin-left:8px}
.sj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.sj-k{background:#fafbfc;border:1px solid #f0f2f5;border-radius:9px;padding:8px 10px}
.sj-k small{display:block;color:#98a2b3;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sj-k b{display:block;font-size:16px;margin-top:2px}
.pb{height:6px;background:#f0f2f5;border-radius:99px;overflow:hidden;margin:2px 0 10px}
.pb i{display:block;height:100%;background:#165DFF;transition:.4s}
.pb i.hit{background:#039855}
.sj-tb{width:100%;border-collapse:collapse;font-size:12px}
.sj-tb th{text-align:left;color:#98a2b3;font-weight:600;font-size:11px;padding:5px 6px;border-bottom:1px solid var(--line)}
.sj-tb td{padding:6px;border-bottom:1px solid #f5f6f8}
.sj-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sj-links a{font-size:12px;color:#165DFF;text-decoration:none;border:1px solid #d1e0ff;background:#f5f8ff;border-radius:7px;padding:4px 10px}
.sj-links a:hover{background:#eaf1ff}
.tag2{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;white-space:nowrap}
.tag2.run{background:#ecfdf3;color:#039855}
.tag2.done{background:#f2f4f7;color:#98a2b3}
.tag2.warn{background:#fffaeb;color:#dc6803}
.tag2.bad{background:#fef3f2;color:#d92d20}
.sj-note{font-size:12px;color:#667085;margin-top:8px}
@media(max-width:820px){.sj-grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="wrap">
<script>window.TIANMA_API='http://127.0.0.1:7788';</script>
  <a class="back" href="./index.html">← 返回入口</a>
  <h1>重点稿件 · 自动投放</h1>
  <p class="lead">目标驱动：达成曲线 · 在看冲刺 · 增量节奏 · 拆解方案 · 资源消耗 · 事件时间线。站点为快照，实时数据看本机面板。</p>
  <div class="bar" id="bar2" style="margin-bottom:10px"></div>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="data/key.js"></script>
<script src="data/demo-key.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
function el(p,t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function tx(p,x,y,s,a){const e=el(p,'text',Object.assign({x:x,y:y,'font-size':9.5,fill:'#98a2b3','font-family':'Consolas,monospace'},a||{}));e.textContent=s;return e}
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const wan=v=>v==null?'—':(v/10000).toFixed(2);
function statusOf(t){
  if(t.status!=='running')return['已结束','idle'];
  if(t.v!=null&&t.v>=t.target*10000)return['已达成','ok'];
  if(!t.pred)return['数据不足','idle'];
  if(t.pred.pred>=t.target*10000*0.95)return['进度正常','ok'];
  if(t.pred.pred>=t.target*10000*0.85)return['略慢','warn'];
  return['无法达成','bad'];
}
function svgBox(w,h){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 '+w+' '+h);s.setAttribute('width','100%');s.style.display='block';return s}
function drawMain(t){
  const W=1120,H=230,L=40,R=12,TP=14,B=26;
  const T=+new Date(t.startAt), DL=+new Date(t.deadline), total=Math.max(1,(DL-T)/60000);
  const dmax=Math.max(t.target*10000*1.25,(t.v||0)*1.3,1);
  const X=mn=>L+(mn/total)*(W-L-R), Y=v=>TP+(1-v/dmax)*(H-TP-B);
  const svg=svgBox(W,H);
  for(let i=0;i<=4;i++){const v=dmax*i/4;el(svg,'line',{x1:L,y1:Y(v),x2:W-R,y2:Y(v),stroke:'#f0f2f5'});tx(svg,L-6,Y(v)+3,wan(v),{'text-anchor':'end'})}
  for(let i=0;i<=4;i++){const mn=total*i/4;tx(svg,X(mn),H-9,hhmm(T+mn*60000),{'text-anchor':'middle'})}
  const v0=t.samples.length?t.samples[0].v:0;
  el(svg,'line',{x1:X(0),y1:Y(v0),x2:X(total),y2:Y(t.target*10000),stroke:'#d0d5dd','stroke-width':1.6,'stroke-dasharray':'5 4'});
  tx(svg,X(total)-2,Y(t.target*10000)-7,'目标 '+t.target+'w',{'text-anchor':'end',fill:'#98a2b3','font-size':11});
  const pts=t.samples.map(s=>[(s.t-T)/60000,s.v]);
  if(pts.length>1){
    el(svg,'polygon',{points:[[X(0),Y(v0)]].concat(pts.map(p=>[X(p[0]),Y(p[1])])).concat([[X(pts[pts.length-1][0]),Y(0)],[X(0),Y(0)]]).map(p=>p[0]+','+p[1]).join(' '),fill:'#165DFF',opacity:.06});
    el(svg,'polyline',{points:pts.map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'none',stroke:'#165DFF','stroke-width':2.2,'stroke-linejoin':'round'});
    pts.forEach(p=>el(svg,'circle',{cx:X(p[0]),cy:Y(p[1]),r:1.8,fill:'#165DFF'}));
  }
  if(t.pred&&pts.length){
    const lp=pts[pts.length-1];
    el(svg,'line',{x1:X(lp[0]),y1:Y(lp[1]),x2:X(total),y2:Y(t.pred.pred),stroke:'#dc6803','stroke-width':1.8,'stroke-dasharray':'4 4'});
    el(svg,'circle',{cx:X(total),cy:Y(t.pred.pred),r:3.5,fill:'#fff',stroke:'#dc6803','stroke-width':2});
    tx(svg,X(total)-2,Y(t.pred.pred)+14,'预测 '+wan(t.pred.pred)+'w',{'text-anchor':'end',fill:'#dc6803','font-size':10.5});
    el(svg,'rect',{x:X(lp[0]),y:Y(Math.min(t.pred.pred,t.target*10000)),width:Math.max(0,X(total)-X(lp[0])),height:Math.abs(Y(t.target*10000)-Y(t.pred.pred)),fill:'#dc6803',opacity:.06});
  }
  return svg;
}
function drawBar(t){
  const W=560,H=160,L=32,R=10,TP=10,B=20;
  const svg=svgBox(W,H);
  const T=+new Date(t.startAt), total=Math.max(1,(+new Date(t.deadline)-T)/60000);
  const d=[];
  for(let i=1;i<t.samples.length;i++)d.push([(t.samples[i].t-T)/60000,t.samples[i].v-t.samples[i-1].v]);
  if(!d.length){tx(svg,W/2,H/2,'数据不足',{'text-anchor':'middle','font-family':'sans-serif'});return svg}
  const vmax=Math.max.apply(null,d.map(x=>x[1]).concat([1]))*1.3;
  const X=mn=>L+(mn/total)*(W-L-R), Y=v=>TP+(1-v/vmax)*(H-TP-B);
  for(let i=0;i<=2;i++){const v=vmax*i/2;tx(svg,L-4,Y(v)+3,wan(v),{'text-anchor':'end'})}
  const bw=Math.max(8,(W-L-R)/Math.max(d.length,8)*0.5);
  d.forEach((p,i)=>{const cx=X(p[0]),y=Y(p[1]);el(svg,'rect',{x:cx-bw/2,y:y,width:bw,height:Math.max(1,H-B-y),rx:2.5,fill:i>=d.length-2?'#dc6803':'#84adff'})});
  if(t.pred&&t.pred.needPer5>0){el(svg,'line',{x1:L,y1:Y(t.pred.needPer5),x2:W-R,y2:Y(t.pred.needPer5),stroke:'#d92d20','stroke-dasharray':'4 4',opacity:.5});tx(svg,W-R-2,Y(t.pred.needPer5)-4,'达标所需 '+wan(t.pred.needPer5),{'text-anchor':'end',fill:'#d92d20','font-size':9})}
  return svg;
}
function drawSprint(t){
  const W=560,H=160,L=30,R=10,TP=10,B=18;
  const svg=svgBox(W,H);
  const sp=t.sprint;
  if(!sp||!sp.samples||sp.samples.length<2){tx(svg,W/2,H/2,'暂无冲刺数据',{'text-anchor':'middle','font-family':'sans-serif'});return svg}
  const T=+new Date(t.startAt);
  const xs=sp.samples.map(s=>(s.t-T)/60000), ys=sp.samples.map(s=>s.on);
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  const ymax=Math.max.apply(null,ys.concat([1200]))*1.2;
  const X=m=>L+((m-x0)/Math.max(0.2,x1-x0))*(W-L-R), Y=v=>TP+(1-v/ymax)*(H-TP-B);
  if(1000<ymax){el(svg,'line',{x1:L,y1:Y(1000),x2:W-R,y2:Y(1000),stroke:'#d92d20','stroke-dasharray':'3 3',opacity:.4});tx(svg,L+2,Y(1000)-3,'1000',{fill:'#d92d20','font-size':9})}
  if(3000<ymax){el(svg,'line',{x1:L,y1:Y(3000),x2:W-R,y2:Y(3000),stroke:'#039855','stroke-dasharray':'3 3',opacity:.4});tx(svg,L+2,Y(3000)-3,'3000',{fill:'#039855','font-size':9})}
  el(svg,'polyline',{points:xs.map((m,i)=>X(m)+','+Y(ys[i])).join(' '),fill:'none',stroke:'#dc6803','stroke-width':2});
  const lp=xs.length-1;
  el(svg,'circle',{cx:X(xs[lp]),cy:Y(ys[lp]),r:2.6,fill:'#dc6803'});
  return svg;
}
function planOf(t){
  const T=+new Date(t.startAt), DL=+new Date(t.deadline);
  const H=(DL-T)/3600000;
  const tm=Math.min(t.target/10*100,200);
  const st=t.target/10*20;
  const prio=t.target<20?'默认':(t.target>=100?'10':'9');
  const cf=H<=2?0.10:0.25;
  const rounds=Math.max(1,Math.round(H/2));
  const per=Math.round(st/rounds*10)/10;
  return {H,tm,st,prio,cf,rounds,per,outT:tm*0.04,outS:st*cf,T,DL};
}
function timeline(t){
  const items=[];
  const T=+new Date(t.startAt);
  items.push([hhmm(T),'创建任务 · 起播点 '+(t.qidian||'未填')+(t.isZero?' · 涉0':'')+' · 理由 '+(t.reason||'—')]);
  items.push([hhmm(T+10*60000),'开始计入增量（前 10min 仅记录时间点）']);
  const ev=(t.events||[]).slice().sort((a,b)=>a.t-b.t);
  ev.forEach(e=>items.push([hhmm(e.t),e.text]));
  const ss=(t.samples||[]).slice(-4).reverse();
  ss.forEach(s=>items.push([hhmm(s.t),'播放 '+wan(s.v)+'w · 在看 '+(s.on==null?'—':s.on)]));
  return items;
}
function render(){
  const D=pickKeyData();
  const tasks=D.tasks||[];
  document.getElementById('bar').innerHTML='<span class="pill">任务 <b>'+tasks.filter(t=>t.status==='running').length+'</b> 个在跑</span>'+
    '<span class="pill">数据快照 <b>'+(D.publishedAt?new Date(D.publishedAt).toLocaleString('zh-CN'):'—')+'</b></span>'+
    '<span class="pill" style="color:#98a2b3">站点为快照 · 实时请看本机面板</span>';
  const list=document.getElementById('list');
  list.innerHTML='';
  tasks.forEach(t=>{
    const [txt,cls]=statusOf(t);
    const ad=t.advice||{act:'none',text:'—'};
    const adColor=(ad.act==='done'||ad.act==='none')?'#98a2b3':(ad.act==='stop_story'?'#dc6803':'#d92d20');
    const p=planOf(t);
    let res='';
    if(t.cards){
      const mk=(arr,label)=>arr.forEach((c,i)=>{
        const pct=c.budget?Math.round(c.spent/c.budget*100):0;
        const ended=new Date(String(c.end).replace(' ','T')+'+08:00')<new Date();
        res+='<tr><td><b>'+label+(arr.length>1?' #'+(i+1):'')+'</b> <span style="color:#98a2b3">P'+(c.priority==null?'-':c.priority)+'</span></td><td>'+wan(c.budget)+'</td><td>'+String(c.start).slice(5,16)+' → '+String(c.end).slice(5,16)+'</td><td><b>'+wan(c.spent)+'</b> <span style="color:#98a2b3">'+pct+'%</span></td><td><span class="tag '+(ended?'done':'live')+'">'+(ended?'已结束':'投放中')+'</span></td></tr>';
      });
      mk(t.cards.tianma||[],'天马'); mk(t.cards.story||[],'Story');
    }
    let planRows='<tr><td>—</td><td><b>天马</b> 强保量</td><td><b>'+p.tm+'w</b></td><td>'+hhmm(p.T)+' → '+hhmm(p.DL)+'</td><td>—</td><td>'+wan(p.outT*10000)+'w</td></tr>';
    for(let i=0;i<p.rounds;i++){
      const s0=p.T+(p.H/p.rounds)*3600000*i, e0=p.T+(p.H/p.rounds)*3600000*(i+1);
      planRows+='<tr><td>第'+(i+1)+'轮</td><td>Story '+(i===0?'<span style="color:#dc6803">首轮</span>':'')+'</td><td>'+p.per+'w</td><td>'+hhmm(s0)+' → '+hhmm(e0)+'</td><td><span class="tag live">'+p.prio+'</span></td><td>'+wan(p.per*p.cf*10000)+'w</td></tr>';
    }
    let chips='';
    for(let k=1;k<=8;k++){const v=(t.target/8)*k;chips+='<span>'+hhmm(p.T+(p.DL-p.T)/8*k)+' <b>'+v.toFixed(1)+'w</b></span>';}
    const tot=p.outT+p.outS, gap=t.target-tot;
    let tl='';
    timeline(t).forEach(it=>{tl+='<li><b>'+it[0]+'</b><span>'+it[1]+'</span></li>'});

    const card=document.createElement('div'); card.className='task'; card.setAttribute('data-bvid',t.bvid);
    card.innerHTML=
      '<div class="th"><div><span class="bv">'+t.bvid+'</span> <span class="tt">'+(t.title||'')+'</span></div><div><span class="st '+cls+'">'+txt+'</span></div></div>'+
      '<div class="kpis">'+
        '<div class="k"><small>当前播放 / 目标 <span class="live-at" style="color:#039855"></span></small><b><span class="live-v">'+wan(t.v)+'</span><span style="font-size:13px;color:#98a2b3"> / '+t.target+'w</span></b></div>'+
        '<div class="k"><small>近 5min 增量</small><b>'+(t.delta==null?'—':(t.delta>=0?'+':'')+wan(t.delta))+'w</b></div>'+
        '<div class="k"><small>预计达成时间</small><b style="font-size:17px;color:'+(t.pred&&t.pred.eta>0&&t.pred.eta>+new Date(t.deadline)?'#d92d20':'#101828')+'">'+(t.pred?(t.pred.eta===-1?'已达成':(t.pred.eta==null?'—':hhmm(t.pred.eta))):'—')+'</b></div>'+
        '<div class="k"><small>预测终值·差 '+(t.pred&&t.pred.pred?wan(t.target*10000-t.pred.pred)+'w':'—')+'</small><b style="font-size:17px">'+(t.pred?wan(t.pred.pred)+'w':'—')+'</b></div>'+
      '</div>'+
      '<div class="adv" style="border-left-color:'+adColor+'"><b>当前建议</b><span style="color:'+adColor+'">'+ad.text+'</span></div>'+
      '<div class="chart"><div class="ct"><span>达成曲线 · 目标 '+t.target+'w · '+hhmm(+new Date(t.deadline))+' 截止</span></div><div class="c1"></div></div>'+
      '<div class="grid2">'+
        '<div class="chart"><div class="ct"><span>每 5 分钟增量（虚线=达标所需）</span></div><div class="c2"></div></div>'+
        '<div class="chart"><div class="ct"><span>在看冲刺（目标 1000+）</span></div><div class="c3"></div></div>'+
      '</div>'+
      '<div class="sec"><h4>拆解预览 · 按目标与时长拆分</h4>'+
        '<table><thead><tr><th>轮次</th><th>资源</th><th>预算</th><th>时间</th><th>优先级</th><th>预期产出</th></tr></thead><tbody>'+planRows+'</tbody></table>'+
        '<div class="plan-foot">预期合计 <b>'+wan(tot*10000)+'w</b>（天马 '+wan(p.outT*10000)+'w + Story '+wan(p.outS*10000)+'w，Story 系数 '+(p.cf*100)+'%）'+(gap>0?' · 差 <b style="color:#d92d20">'+gap.toFixed(1)+'w</b> 依赖自然流量或后续追加':' · 已覆盖目标')+'</div>'+
        '<div style="margin-top:8px"><div style="font-size:11px;color:#98a2b3;margin-bottom:4px">对账线（每段应到播放）</div><div class="chips">'+chips+'</div></div>'+
      '</div>'+
      '<div class="sec"><h4>生效资源 · 单位 w 曝光</h4>'+
        '<table><thead><tr><th>资源</th><th>预算</th><th>时间</th><th>消耗</th><th>状态</th></tr></thead><tbody>'+(res||'<tr><td colspan="5" style="color:#98a2b3">暂无卡片数据</td></tr>')+'</tbody></table>'+
      '</div>'+
      '<div class="sec"><h4>事件时间线</h4><ul class="tl">'+tl+'</ul></div>'+
      '<div class="acts">'+
        '<button data-act="add_story" data-id="'+t.id+'">＋ 投新一轮 Story</button>'+
        '<button data-act="stop_story" data-id="'+t.id+'">停 Story</button>'+
        '<button class="hot" data-act="stop_tianma" data-id="'+t.id+'">停天马</button>'+
        '<button data-act="refresh">刷新数据</button>'+
      '</div>'+
      '<div id="msg_'+t.id+'" style="font-size:11.5px;color:#98a2b3;margin-top:8px"></div>'+
      '<div style="font-size:11px;color:#98a2b3;margin-top:8px">操作按钮需连接后端服务后启用（当前为只读快照）</div>';
    list.appendChild(card);
    card.querySelector('.c1').appendChild(drawMain(t));
    card.querySelector('.c2').appendChild(drawBar(t));
    card.querySelector('.c3').appendChild(drawSprint(t));
  });
  document.getElementById('foot').textContent='数据由本机采集端发布 · 最近更新 '+(D.publishedAt?new Date(D.publishedAt).toLocaleString('zh-CN'):'—');
}
var DEMO=false, AUTO_DEMO=false;

  var real=window.TIANMA_BOARD;
  if(DEMO) return window.TIANMA_DEMO_KEY||{tasks:[]};
  return real||{tasks:[]};
}
function toggleDemo(){ DEMO=!DEMO; AUTO_DEMO=false; paintDemoBar(); render(); }
function paintDemoBar(){
  var el2=document.getElementById('demoBar'); if(!el2) return;

  el2.style.display='block';
  el2.innerHTML='<span style="background:#fffaeb;color:#b54708;border:1px solid #f5d78e;border-radius:6px;padding:3px 10px;font-weight:700">演示数据 · 非真实投放</span>'
   +'<span style="margin-left:10px;color:#8a6100">这是样张，用来看页面长什么样</span>'

}
function boot(){
  var real=window.TIANMA_BOARD;
  if(!(real&&real.tasks&&real.tasks.length)){ DEMO=true; AUTO_DEMO=true; }
  paintDemoBar(); render();
}
if(document.getElementById('list')){ var _db=document.createElement('div'); _db.id='demoBar'; _db.style.cssText='display:none;margin:0 0 14px;background:#fffaf0;border:1px solid #f5d78e;border-radius:10px;padding:10px 14px;font-size:12.5px'; document.getElementById('list').parentNode.insertBefore(_db,document.getElementById('list')); }
boot();
function reloadData(){
  if(DEMO) return;
  var s=document.createElement('script');s.src='data/key.js?v='+Date.now();
  s.onload=function(){ if(AUTO_DEMO){ var r=window.TIANMA_BOARD; if(!(r&&r.tasks&&r.tasks.length)){s.remove();return;} DEMO=false;AUTO_DEMO=false;paintDemoBar(); } render(); s.remove(); };
  document.body.appendChild(s);
}
function _unusedReload(){var s=document.createElement('script');s.src='data/key.js?v='+Date.now();s.onload=function(){render();s.remove();};document.body.appendChild(s);}
setInterval(reloadData,60000);

</script><div id="mask" style="display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:999;align-items:center;justify-content:center">

<script>
  // 跳转式执行（浏览器禁止 https→http 请求，但允许顶级跳转）
  var API='http://127.0.0.1:7788';
  var BACK='https://sites.bilibili.co/zhengmei-daily-report/tianma/index.html';
  function go(qs){ location.href=(window.SJ_EXEC||API)+'/do?'+qs+'&k='+(window.SJ_KEY||'')+'&back='+encodeURIComponent(BACK); }
  window.openForm=function(){document.getElementById('mask').style.display='flex';};
  window.submitTask=function(){
    var bv=document.getElementById('f_bv').value.trim();
    var tg=Number(document.getElementById('f_tg').value);
    var md=document.getElementById('f_md').value;
    var el=document.getElementById('f_msg');
    if(!/^BV[0-9A-Za-z]{8,12}$/.test(bv)){el.textContent='BV 号格式不对';return;}
    if(!(tg>0)){el.textContent='目标必须大于 0';return;}
    var dl;
    if(md==='at'){var t=document.getElementById('f_at').value||'18:00';var d=new Date();var p2=t.split(':');d.setHours(+p2[0],+p2[1],0,0);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1);dl=d.toISOString();}
    else dl=new Date(Date.now()+2*3600*1000).toISOString();
    go('act=new&bvid='+encodeURIComponent(bv)+'&target='+tg+'&deadline='+encodeURIComponent(dl)
      +'&qidian='+encodeURIComponent(document.getElementById('f_qd').value||'00:00:15')
      +'&materialId='+encodeURIComponent(document.getElementById('f_mt').value||'')
      +'&isZero='+(document.getElementById('f_z').value==='1'?'1':'0')
      +'&remark='+encodeURIComponent(document.getElementById('f_rk').value||''));
  };
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-act]');
    if(!b)return;
    var a=b.getAttribute('data-act');
    if(a==='refresh'){location.reload();return;}
    if(a==='stop_tianma'&&!confirm('确认停止天马投放？'))return;
    if(a==='stop_story'&&!confirm('确认停止 Story 投放？'))return;
    if(a==='add_story'&&!confirm('确认投新一轮 Story？'))return;
    go('act='+a+'&taskId='+encodeURIComponent(b.getAttribute('data-id')||'')
      +'&budget='+(b.getAttribute('data-budget')||''));
  });
  (function(){
    var bar=document.getElementById('bar2'); if(!bar)return;
    bar.innerHTML='<span class="pill" style="background:#eff4ff;color:#165DFF;border-color:#b2ccff"><b>操作走本机</b> · 点按钮会短暂跳转到本机执行后自动返回</span>'
      +'<button onclick="openForm()" style="padding:5px 14px;border-radius:99px;border:0;background:#165DFF;color:#fff;font-size:13px;font-weight:600;cursor:pointer">＋ 新建任务</button>'
      +'<a href="'+API+'/do?act=ping&back='+encodeURIComponent(BACK)+'" style="padding:5px 12px;border-radius:99px;border:1px solid #e4e7ec;background:#fff;font-size:12.5px;color:#667085;text-decoration:none">检测本机</a>';
  })();
</script>
